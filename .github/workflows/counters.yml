# Redraws out/counters.svg (profile views and followers) every 6 hours and commits it if the numbers
# changed. Commits are made by the GitHub Actions bot, not by the profile owner.
name: counters

on:
  schedule:
    - cron: "17 */6 * * *"   # an off-peak minute: runs at :00 are the most often delayed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: counters
  cancel-in-progress: false

jobs:
  redraw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the new picture if the numbers changed
        run: |
          if git diff --quiet -- out/counters.svg; then
            echo "numbers unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/counters.svg
          git commit -m "chore: update profile counters"
          git push
